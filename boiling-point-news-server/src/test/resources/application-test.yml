spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:boiling_point_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/test-schema.sql
      data-locations: classpath:db/test-data.sql
  data:
    redis:
      repositories:
        enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.boilingpoint.news.mapper: debug
