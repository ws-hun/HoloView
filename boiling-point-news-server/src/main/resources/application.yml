spring:
  application:
    name: boiling-point-news-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.boilingpoint.news.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  cache:
    enabled: ${CACHE_ENABLED:true}
  collector:
    initial-delay: ${COLLECTOR_INITIAL_DELAY:60000}
    fixed-delay: ${COLLECTOR_FIXED_DELAY:60000}
    baidu:
      enabled: ${BAIDU_COLLECTOR_ENABLED:true}
      url: ${BAIDU_COLLECTOR_URL:https://top.baidu.com/board?tab=realtime}
      limit: ${BAIDU_COLLECTOR_LIMIT:30}
      timeout: ${BAIDU_COLLECTOR_TIMEOUT:10s}
    toutiao:
      enabled: ${TOUTIAO_COLLECTOR_ENABLED:true}
      url: ${TOUTIAO_COLLECTOR_URL:https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc}
      limit: ${TOUTIAO_COLLECTOR_LIMIT:30}
      timeout: ${TOUTIAO_COLLECTOR_TIMEOUT:10s}
    zhihu:
      enabled: ${ZHIHU_COLLECTOR_ENABLED:true}
      url: ${ZHIHU_COLLECTOR_URL:https://www.zhihu.com/api/v3/feed/topstory/hot-list-web?limit=20&desktop=true}
      limit: ${ZHIHU_COLLECTOR_LIMIT:20}
      timeout: ${ZHIHU_COLLECTOR_TIMEOUT:10s}
    bilibili:
      enabled: ${BILIBILI_COLLECTOR_ENABLED:true}
      url: ${BILIBILI_COLLECTOR_URL:https://api.bilibili.com/x/web-interface/popular?ps=30&pn=1}
      limit: ${BILIBILI_COLLECTOR_LIMIT:30}
      timeout: ${BILIBILI_COLLECTOR_TIMEOUT:10s}
    juejin:
      enabled: ${JUEJIN_COLLECTOR_ENABLED:true}
      url: ${JUEJIN_COLLECTOR_URL:https://api.juejin.cn/content_api/v1/content/article_rank?category_id=1&type=hot&spider=0}
      limit: ${JUEJIN_COLLECTOR_LIMIT:30}
      timeout: ${JUEJIN_COLLECTOR_TIMEOUT:10s}
    the-paper:
      enabled: ${THE_PAPER_COLLECTOR_ENABLED:true}
      url: ${THE_PAPER_COLLECTOR_URL:https://cache.thepaper.cn/contentapi/wwwIndex/rightSidebar}
      limit: ${THE_PAPER_COLLECTOR_LIMIT:30}
      timeout: ${THE_PAPER_COLLECTOR_TIMEOUT:10s}
    ithome:
      enabled: ${ITHOME_COLLECTOR_ENABLED:true}
      url: ${ITHOME_COLLECTOR_URL:https://www.ithome.com/list/}
      limit: ${ITHOME_COLLECTOR_LIMIT:30}
      timeout: ${ITHOME_COLLECTOR_TIMEOUT:10s}
    kr36:
      enabled: ${KR36_COLLECTOR_ENABLED:true}
      url: ${KR36_COLLECTOR_URL:https://www.36kr.com/newsflashes}
      limit: ${KR36_COLLECTOR_LIMIT:30}
      timeout: ${KR36_COLLECTOR_TIMEOUT:10s}
    jin10:
      enabled: ${JIN10_COLLECTOR_ENABLED:true}
      url: ${JIN10_COLLECTOR_URL:https://www.jin10.com/flash_newest.js}
      limit: ${JIN10_COLLECTOR_LIMIT:30}
      timeout: ${JIN10_COLLECTOR_TIMEOUT:10s}
    hacker-news:
      enabled: ${HACKER_NEWS_COLLECTOR_ENABLED:true}
      url: ${HACKER_NEWS_COLLECTOR_URL:https://hacker-news.firebaseio.com/v0/topstories.json}
      item-url: ${HACKER_NEWS_ITEM_URL:https://hacker-news.firebaseio.com/v0/item/}
      limit: ${HACKER_NEWS_COLLECTOR_LIMIT:30}
      timeout: ${HACKER_NEWS_COLLECTOR_TIMEOUT:10s}
  source-link:
    timeout: ${SOURCE_LINK_TIMEOUT:8s}
    cache-ttl: ${SOURCE_LINK_CACHE_TTL:30m}
  sse:
    timeout: ${SSE_TIMEOUT:1800000}
    heartbeat-interval: ${SSE_HEARTBEAT_INTERVAL:30000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-system}] %logger{36} - %msg%n"
  level:
    root: info
    com.boilingpoint.news: info
