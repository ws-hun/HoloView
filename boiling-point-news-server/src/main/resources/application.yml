spring:
  application:
    name: boiling-point-news-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.boilingpoint.news.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  collector:
    fixed-delay: ${COLLECTOR_FIXED_DELAY:60000}
  sse:
    timeout: ${SSE_TIMEOUT:1800000}
    heartbeat-interval: ${SSE_HEARTBEAT_INTERVAL:30000}

logging:
  level:
    root: info
    com.boilingpoint.news: info
