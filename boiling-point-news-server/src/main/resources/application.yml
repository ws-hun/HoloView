spring:
  application:
    name: boiling-point-news-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.boilingpoint.news.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  cache:
    enabled: ${CACHE_ENABLED:true}
  collector:
    initial-delay: ${COLLECTOR_INITIAL_DELAY:60000}
    fixed-delay: ${COLLECTOR_FIXED_DELAY:60000}
    baidu:
      enabled: ${BAIDU_COLLECTOR_ENABLED:true}
      url: ${BAIDU_COLLECTOR_URL:https://top.baidu.com/board?tab=realtime}
      limit: ${BAIDU_COLLECTOR_LIMIT:30}
      timeout: ${BAIDU_COLLECTOR_TIMEOUT:10s}
    toutiao:
      enabled: ${TOUTIAO_COLLECTOR_ENABLED:true}
      url: ${TOUTIAO_COLLECTOR_URL:https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc}
      limit: ${TOUTIAO_COLLECTOR_LIMIT:30}
      timeout: ${TOUTIAO_COLLECTOR_TIMEOUT:10s}
    zhihu:
      enabled: ${ZHIHU_COLLECTOR_ENABLED:true}
      url: ${ZHIHU_COLLECTOR_URL:https://www.zhihu.com/api/v3/feed/topstory/hot-list-web?limit=20&desktop=true}
      limit: ${ZHIHU_COLLECTOR_LIMIT:20}
      timeout: ${ZHIHU_COLLECTOR_TIMEOUT:10s}
    weibo:
      enabled: ${WEIBO_COLLECTOR_ENABLED:true}
      url: ${WEIBO_COLLECTOR_URL:https://s.weibo.com/top/summary?cate=realtimehot}
      fallback-url: ${WEIBO_COLLECTOR_FALLBACK_URL:}
      cookie: ${WEIBO_COLLECTOR_COOKIE:}
      limit: ${WEIBO_COLLECTOR_LIMIT:30}
      timeout: ${WEIBO_COLLECTOR_TIMEOUT:10s}
    douyin:
      enabled: ${DOUYIN_COLLECTOR_ENABLED:true}
      url: ${DOUYIN_COLLECTOR_URL:https://www.douyin.com/aweme/v1/web/hot/search/list/?device_platform=webapp&aid=6383&channel=channel_pc_web&detail_list=1}
      fallback-url: ${DOUYIN_COLLECTOR_FALLBACK_URL:}
      limit: ${DOUYIN_COLLECTOR_LIMIT:30}
      timeout: ${DOUYIN_COLLECTOR_TIMEOUT:10s}
    bilibili:
      enabled: ${BILIBILI_COLLECTOR_ENABLED:true}
      url: ${BILIBILI_COLLECTOR_URL:https://api.bilibili.com/x/web-interface/popular?ps=30&pn=1}
      limit: ${BILIBILI_COLLECTOR_LIMIT:30}
      timeout: ${BILIBILI_COLLECTOR_TIMEOUT:10s}
    juejin:
      enabled: ${JUEJIN_COLLECTOR_ENABLED:true}
      url: ${JUEJIN_COLLECTOR_URL:https://api.juejin.cn/content_api/v1/content/article_rank?category_id=1&type=hot&spider=0}
      limit: ${JUEJIN_COLLECTOR_LIMIT:30}
      timeout: ${JUEJIN_COLLECTOR_TIMEOUT:10s}
    the-paper:
      enabled: ${THE_PAPER_COLLECTOR_ENABLED:true}
      url: ${THE_PAPER_COLLECTOR_URL:https://cache.thepaper.cn/contentapi/wwwIndex/rightSidebar}
      limit: ${THE_PAPER_COLLECTOR_LIMIT:30}
      timeout: ${THE_PAPER_COLLECTOR_TIMEOUT:10s}
    ithome:
      enabled: ${ITHOME_COLLECTOR_ENABLED:true}
      url: ${ITHOME_COLLECTOR_URL:https://www.ithome.com/list/}
      limit: ${ITHOME_COLLECTOR_LIMIT:30}
      timeout: ${ITHOME_COLLECTOR_TIMEOUT:10s}
    kr36:
      enabled: ${KR36_COLLECTOR_ENABLED:true}
      url: ${KR36_COLLECTOR_URL:https://www.36kr.com/newsflashes}
      limit: ${KR36_COLLECTOR_LIMIT:30}
      timeout: ${KR36_COLLECTOR_TIMEOUT:10s}
    jin10:
      enabled: ${JIN10_COLLECTOR_ENABLED:true}
      url: ${JIN10_COLLECTOR_URL:https://www.jin10.com/flash_newest.js}
      limit: ${JIN10_COLLECTOR_LIMIT:30}
      timeout: ${JIN10_COLLECTOR_TIMEOUT:10s}
    hacker-news:
      enabled: ${HACKER_NEWS_COLLECTOR_ENABLED:true}
      url: ${HACKER_NEWS_COLLECTOR_URL:https://hacker-news.firebaseio.com/v0/topstories.json}
      item-url: ${HACKER_NEWS_ITEM_URL:https://hacker-news.firebaseio.com/v0/item/}
      limit: ${HACKER_NEWS_COLLECTOR_LIMIT:30}
      timeout: ${HACKER_NEWS_COLLECTOR_TIMEOUT:10s}
    wallstreet-cn:
      enabled: ${WALLSTREET_CN_COLLECTOR_ENABLED:true}
      url: ${WALLSTREET_CN_COLLECTOR_URL:https://api-one-wscn.awtmt.com/apiv1/content/lives?channel=global-channel&limit=30}
      limit: ${WALLSTREET_CN_COLLECTOR_LIMIT:30}
      timeout: ${WALLSTREET_CN_COLLECTOR_TIMEOUT:10s}
    nowcoder:
      enabled: ${NOWCODER_COLLECTOR_ENABLED:true}
      url: ${NOWCODER_COLLECTOR_URL:https://gw-c.nowcoder.com/api/sparta/hot-search/top-hot-pc?size=20&t=}
      limit: ${NOWCODER_COLLECTOR_LIMIT:20}
      timeout: ${NOWCODER_COLLECTOR_TIMEOUT:10s}
    tieba:
      enabled: ${TIEBA_COLLECTOR_ENABLED:true}
      url: ${TIEBA_COLLECTOR_URL:https://tieba.baidu.com/hottopic/browse/topicList}
      limit: ${TIEBA_COLLECTOR_LIMIT:30}
      timeout: ${TIEBA_COLLECTOR_TIMEOUT:10s}
    hupu:
      enabled: ${HUPU_COLLECTOR_ENABLED:true}
      url: ${HUPU_COLLECTOR_URL:https://bbs.hupu.com/topic-daily-hot}
      limit: ${HUPU_COLLECTOR_LIMIT:20}
      timeout: ${HUPU_COLLECTOR_TIMEOUT:10s}
    douban-movie:
      enabled: ${DOUBAN_MOVIE_COLLECTOR_ENABLED:true}
      url: ${DOUBAN_MOVIE_COLLECTOR_URL:https://m.douban.com/rexxar/api/v2/subject/recent_hot/movie?start=0&limit=20&category=%E7%83%AD%E9%97%A8&type=%E5%85%A8%E9%83%A8}
      limit: ${DOUBAN_MOVIE_COLLECTOR_LIMIT:20}
      timeout: ${DOUBAN_MOVIE_COLLECTOR_TIMEOUT:10s}
    github-trending:
      enabled: ${GITHUB_TRENDING_COLLECTOR_ENABLED:true}
      url: ${GITHUB_TRENDING_COLLECTOR_URL:https://github.com/trending?spoken_language_code=}
      limit: ${GITHUB_TRENDING_COLLECTOR_LIMIT:25}
      timeout: ${GITHUB_TRENDING_COLLECTOR_TIMEOUT:15s}
    steam:
      enabled: ${STEAM_COLLECTOR_ENABLED:true}
      url: ${STEAM_COLLECTOR_URL:https://store.steampowered.com/stats/stats/}
      limit: ${STEAM_COLLECTOR_LIMIT:30}
      timeout: ${STEAM_COLLECTOR_TIMEOUT:10s}
    smzdm:
      enabled: ${SMZDM_COLLECTOR_ENABLED:true}
      url: ${SMZDM_COLLECTOR_URL:https://post.smzdm.com/hot_1/}
      fallback-url: ${SMZDM_COLLECTOR_FALLBACK_URL:https://post.smzdm.com/feed/}
      limit: ${SMZDM_COLLECTOR_LIMIT:30}
      timeout: ${SMZDM_COLLECTOR_TIMEOUT:10s}
    dongqiudi:
      enabled: ${DONGQIUDI_COLLECTOR_ENABLED:true}
      url: ${DONGQIUDI_COLLECTOR_URL:https://api.dongqiudi.com/app/tabs/web/1.json}
      limit: ${DONGQIUDI_COLLECTOR_LIMIT:20}
      timeout: ${DONGQIUDI_COLLECTOR_TIMEOUT:10s}
  source-link:
    timeout: ${SOURCE_LINK_TIMEOUT:8s}
    cache-ttl: ${SOURCE_LINK_CACHE_TTL:30m}
  sse:
    timeout: ${SSE_TIMEOUT:1800000}
    heartbeat-interval: ${SSE_HEARTBEAT_INTERVAL:30000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-system}] %logger{36} - %msg%n"
  level:
    root: info
    com.boilingpoint.news: info
