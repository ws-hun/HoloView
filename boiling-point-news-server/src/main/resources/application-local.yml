spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:boiling_point_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local-schema.sql
      data-locations: classpath:db/local-data.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      timeout: 3s

app:
  collector:
    initial-delay: ${COLLECTOR_INITIAL_DELAY:10000}
    fixed-delay: ${COLLECTOR_FIXED_DELAY:60000}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.boilingpoint.news: debug
